name: CI

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci
      POSTGRES_USER: shorty
      POSTGRES_DB: shorty
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      - name: Démarrer la db
        run: docker compose up -d --wait db

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test API
        working-directory: api
        env:
          DATABASE_URL: postgres://shorty:ci@localhost:5432/shorty
        run: |
          npm ci
          npm test

      - name: Construire l'image de prod
        run: docker compose -f compose.yaml build

      - name: Login et push sur docker hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "$DOCKERHUB_USERNAME" --password-stdin
          docker compose push api front